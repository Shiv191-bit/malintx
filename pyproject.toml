[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malintx"
version = "0.2.0"
description = "MALINT-X: Android malware analysis and threat intelligence platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team Boots N' Guts" }]
dependencies = [
    "androguard>=4.1,<5",
    "defusedxml>=0.7",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1",
    "reportlab>=4.0,<6",
    "streamlit>=1.35",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "cryptography>=42", "pypdf>=4"]

[project.scripts]
malintx-api = "malintx.api.app:main"
malintx-dashboard = "malintx.dashboard.launcher:main"
malintx-eval = "malintx.evaluation.cli:main"

[tool.setuptools.packages.find]
include = ["malintx*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S603", "S607", "E501", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"malintx/api/app.py" = ["B008"]  # FastAPI dependency/File() defaults are the framework idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: slower integration tests"]
